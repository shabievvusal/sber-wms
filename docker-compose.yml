# Ротация логов контейнеров. Без неё json-логи Docker растут бесконечно, а
# Caddy теперь пишет журнал каждого запроса (см. Caddyfile) — 5 × 20 МБ на
# контейнер хватает на несколько суток истории для разбора инцидентов.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# restart: unless-stopped у всех сервисов (2026-09-13). Раньше у caddy/
# dotnet было on-failure — такой контейнер Docker НЕ поднимает после
# перезагрузки сервера, если тот завершился штатно (caddy и dotnet выходят с
# кодом 0 по SIGTERM). Итог: после каждой перезагрузки сайт лежал, пока
# кто-нибудь не делал `docker compose up -d` руками (12.09 — 46 минут).
services:
  # Caddy — HTTPS, раздача сайта и фото с диска, /api/* → dotnet (Caddyfile).
  # Образ собирается из корневого Dockerfile: Caddy + собранный фронтенд и
  # Caddyfile внутри (node убран 2026-10-31). Единственный сервис с внешними
  # портами: 80/443 — домен robops.ru с автоматическим HTTPS, 443/udp — HTTP/3.
  caddy:
    build: .
    image: wms-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Сертификаты Let's Encrypt и состояние Caddy. Без томов сертификат
      # выпускался бы заново при каждом пересоздании контейнера и упёрся бы
      # в лимиты Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
      # фото жалоб «Консолидации» (uploads в томе node-persist) — Caddy
      # отдаёт их прямо с диска
      - node-persist:/srv/node-persist:ro
      # фото РК (приёмка/отгрузка) — пишет dotnet, Caddy отдаёт с диска
      - rk-photos:/srv/rk-photos:ro
    depends_on:
      dotnet:
        condition: service_started

  # dotnet — бэкенд сайта (все /api/*, см. Caddyfile).
  # Фото РК — на томе rk-photos (dotnet пишет, Caddy раздаёт с диска).
  dotnet:
    build: ./backend-dotnet
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "5080"
    env_file: .env
    environment:
      - PG_HOST=postgres
      - PG_PORT=${PG_PORT:-5432}
      - PG_DB=${PG_DB:-zlp}
      - PG_USER=${PG_USER:-zlp}
      - PG_PASSWORD=${PG_PASSWORD}
      - RK_PHOTOS_DIR=/data/rk-photos
    volumes:
      # фото РК и превью — переживают пересборку (раньше лежали внутри контейнера)
      - rk-photos:/data/rk-photos
      # том с данными, что раньше вёл node (имя осталось с тех пор): видео
      # «Нарушений» (data/violation-videos), фото консолидации (uploads),
      # Excel весов товаров (data/product-weights.xlsx)
      - node-persist:/data/node-persist
    depends_on:
      postgres:
        condition: service_healthy
    # Без healthcheck: mcr.microsoft.com/dotnet/aspnet:9.0 не содержит
    # curl/wget по умолчанию, а Caddy и так ждёт только service_started
    # (не service_healthy) для этого сервиса — см. depends_on у caddy выше.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # Настройки под сервер с ~8 ГБ RAM и SSD (2026-09-13). По умолчанию у
    # Postgres shared_buffers = 128 МБ при базе 4+ ГБ и wms_ops в миллионы
    # строк — почти всё читалось мимо собственного кэша. random_page_cost=1.1 —
    # поправка на SSD (дефолт 4 рассчитан на HDD и отговаривает от индексов),
    # max_wal_size — реже контрольные точки при пакетном ingest статистики.
    # shm_size: у Docker /dev/shm по умолчанию 64 МБ, а параллельные запросы
    # Postgres берут разделяемую память оттуда — на больших сканах падали бы
    # с "could not resize shared memory segment".
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=2GB
    environment:
      POSTGRES_DB:       ${PG_DB:-zlp}
      POSTGRES_USER:     ${PG_USER:-zlp}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-zlp} -d ${PG_DB:-zlp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # node-persist — имя историческое (node убран 2026-10-31), данные в нём живые
  node-persist:
    driver: local
  pg-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  rk-photos:
    driver: local
