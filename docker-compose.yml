# Ротация логов контейнеров. Без неё json-логи Docker растут бесконечно, а
# Caddy теперь пишет журнал каждого запроса (см. Caddyfile) — 5 × 20 МБ на
# контейнер хватает на несколько суток истории для разбора инцидентов.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# restart: unless-stopped у всех сервисов (2026-09-13). Раньше у caddy/node/
# dotnet было on-failure — такой контейнер Docker НЕ поднимает после
# перезагрузки сервера, если тот завершился штатно (caddy и dotnet выходят с
# кодом 0 по SIGTERM). Итог: после каждой перезагрузки сайт лежал, пока
# кто-нибудь не делал `docker compose up -d` руками (12.09 — 46 минут).
services:
  # Trek 2, Фаза 0 — reverse-proxy перед node и dotnet. Единственный сервис с
  # внешним портом теперь caddy (раньше — node напрямую), см. Caddyfile.
  # 80/443 (2026-09-13) — домен robops.ru с автоматическим HTTPS, 443/udp —
  # HTTP/3. Старый адрес http://<IP>:3009 убран — только по домену.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты Let's Encrypt и состояние Caddy. Без томов сертификат
      # выпускался бы заново при каждом пересоздании контейнера и упёрся бы
      # в лимиты Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      node:
        condition: service_healthy
      dotnet:
        condition: service_started

  node:
    build:
      context: .
      # Фронтенд собирается из `frontend-app/` — обычной подпапки этого же
      # build context (см. Dockerfile, stage frontend-builder). До
      # объединения фронтенда и бэкенда в один репозиторий (2026-07-15)
      # здесь был доп.контекст на сиблинг-папку `new zlp` — больше не
      # нужен, обе части проекта теперь в одном каталоге.
    image: wms-node
    restart: unless-stopped
    # node запускается как PID 1 и без init игнорирует SIGTERM — Docker ждал
    # 10 с и убивал его SIGKILL посреди возможной записи JSON-файлов в data/.
    # init (tini) пересылает сигнал, процесс завершается сразу.
    init: true
    logging: *default-logging
    expose:
      - "3009"
    env_file: .env
    environment:
      - NODE_HOST_PROJECT_PATH=${PWD}
      # Caddyfile жёстко проксирует на node:3009, поэтому node ВСЕГДА должен
      # слушать именно 3009 внутри контейнера. Эта строка перекрывает PORT из
      # .env, если он там задан (Compose: explicit environment важнее
      # env_file), иначе server.js (`process.env.PORT || 3000`) слушал бы
      # другой порт и Caddy получал бы "connection refused". Наружу 3009 не
      # пробрасывается — сайт доступен только через caddy по домену.
      - PORT=3009
    volumes:
      - node-persist:/app/persist
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/host-project
      - ./backend/server.js:/app/backend/server.js
      - ./backend/vs-auth.js:/app/backend/vs-auth.js
      - ./backend/vs-auth-pg.js:/app/backend/vs-auth-pg.js
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:'+process.env.PORT+'/api/status', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Фаза 0 — /api/dotnet-status. Фаза 1 — route-rk-pg.js перенесён целиком
  # (routes/ship/receive/eo/drivers/cfz/photos/events), см. Program.cs.
  # env_file: .env — нужен целиком (не только PG_*), т.к. фото теперь льются
  # в S3 отсюда же (S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY/S3_BUCKET/
  # S3_PUBLIC_URL), та же переменная DOTNET_PORT (если задана) тоже отсюда.
  dotnet:
    build: ./backend-dotnet
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "5080"
    env_file: .env
    environment:
      - PG_HOST=postgres
      - PG_PORT=${PG_PORT:-5432}
      - PG_DB=${PG_DB:-zlp}
      - PG_USER=${PG_USER:-zlp}
      - PG_PASSWORD=${PG_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    # Без healthcheck: mcr.microsoft.com/dotnet/aspnet:9.0 не содержит
    # curl/wget по умолчанию, а Caddy и так ждёт только service_started
    # (не service_healthy) для этого сервиса — см. depends_on у caddy выше.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # Настройки под сервер с ~8 ГБ RAM и SSD (2026-09-13). По умолчанию у
    # Postgres shared_buffers = 128 МБ при базе 4+ ГБ и wms_ops в миллионы
    # строк — почти всё читалось мимо собственного кэша. random_page_cost=1.1 —
    # поправка на SSD (дефолт 4 рассчитан на HDD и отговаривает от индексов),
    # max_wal_size — реже контрольные точки при пакетном ingest статистики.
    # shm_size: у Docker /dev/shm по умолчанию 64 МБ, а параллельные запросы
    # Postgres берут разделяемую память оттуда — на больших сканах падали бы
    # с "could not resize shared memory segment".
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=2GB
    environment:
      POSTGRES_DB:       ${PG_DB:-zlp}
      POSTGRES_USER:     ${PG_USER:-zlp}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-zlp} -d ${PG_DB:-zlp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  node-persist:
    driver: local
  pg-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
